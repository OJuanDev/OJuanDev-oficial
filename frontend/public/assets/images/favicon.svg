<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#080808" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="80%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#c8f050" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#c8f050" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="6" />
  
  <!-- Subtle Radial Accent Glow -->
  <rect x="35" y="35" width="442" height="442" rx="93" fill="url(#glowGrad)" />

  <!-- Monogram O -->
  <circle cx="175" cy="256" r="68" stroke="#f0ede8" stroke-width="34" fill="none" />

  <!-- Monogram J -->
  <path d="M 320 188 V 284 C 320 322 291 342 260 342 C 243 342 230 334 221 320" stroke="#f0ede8" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Brand Signature Accent Dot -->
  <circle cx="377" cy="308" r="22" fill="#c8f050" />
</svg>
